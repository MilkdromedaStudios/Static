services:
  static:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STATIC_AUTH_TOKEN: ${STATIC_AUTH_TOKEN:?Set STATIC_AUTH_TOKEN in .env (at least 24 characters)}
      STATIC_ALLOWED_HOSTS: ${STATIC_ALLOWED_HOSTS:-localhost,127.0.0.1}
      STATIC_API_KEY: ${STATIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
    volumes:
      - static-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  ollama:
    image: ollama/ollama:0.34.1
    profiles: [local]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # CPU by default. Configure GPU access using Ollama's platform-specific docs.
volumes:
  static-data:
    name: ${STATIC_DATA_VOLUME:-static-workspace-data}
  ollama-data:
