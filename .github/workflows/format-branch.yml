name: One-time format terminal PR
on:
  push:
    branches: [feature/custom-api-terminal]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.11,<1'
      - run: python -m ruff format static_ai tests scripts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static_ai tests scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Format Python files with Ruff [skip ci]'
            git push origin HEAD:feature/custom-api-terminal
          fi
