name: Format extension branch (temporary)
on:
  push:
    branches: [feature/extensions-fiverr-seller-workspace]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/extensions-fiverr-seller-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Autoformat changed code
        run: |
          python -m pip install 'ruff>=0.11,<1'
          python -m ruff check --fix static_ai tests scripts
          python -m ruff format static_ai tests scripts
          python -m compileall -q static_ai extensions
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static_ai tests scripts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Ruff formatting to extension integration"
            git push origin HEAD:feature/extensions-fiverr-seller-workspace
          fi
