name: Test Static
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check static_ai tests scripts
      - run: python -m ruff format --check static_ai tests scripts
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python scripts/build_preview.py --output test-results/pages/Static
          python tests/ui_server.py > test-results/live-server.log 2>&1 &
          python -m http.server 8766 --bind 127.0.0.1 --directory test-results/pages > test-results/preview-server.log 2>&1 &
          node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-browser-results
          path: test-results/*.png
