[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "static-ai-workspace"
version = "0.3.0"
description = "Static: a local-first AI workspace and cost-aware agent orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "python-dotenv>=1,<2", "beautifulsoup4>=4.12,<5", "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2", "reportlab>=4.2,<5", "pypdf>=6.10,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
desktop = ["PySide6==6.11.2"]
[project.scripts]
static-ai = "static_ai.cli:main"
static-desktop = "static_ai.desktop:main"
[tool.setuptools.packages.find]
include = ["static_ai*"]
[tool.setuptools.package-data]
static_ai = ["static/*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
